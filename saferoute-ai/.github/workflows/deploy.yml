name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: saferoute-ai/package-lock.json

      - name: Install Dependencies
        run: |
          cd saferoute-ai
          npm ci

      - name: Build Application
        run: |
          cd saferoute-ai
          npm run build

      - name: Upload Static Web Assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: saferoute-ai/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
